name: NodeJS CI

on: [push]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Unit checks
        run: |
          npm ci
          npm test -- --ci --runInBand --reporters=default --reporters=jest-junit

      - name: Debug unit test report
        if: always()
        run: |
          dir
          dir reports
          dir reports\junit
          if (Test-Path reports\junit\junit.xml) { echo "Unit JUnit report found" } else { echo "Unit JUnit report NOT found" }

      - name: E2E checks
        run: |
          Start-Process npm -ArgumentList "start" -NoNewWindow
          Start-Sleep -Seconds 10
          npx wdio run ./wdio.conf.js

      - name: Debug e2e report
        if: always()
        run: |
          dir reports
          if (Test-Path reports\e2e-report) { dir reports\e2e-report } else { echo "reports/e2e-report folder NOT found" }

      - name: Build production artifacts
        run: |
          npm run build --if-present

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            reports/junit/junit.xml
            reports/e2e-report/*.xml
